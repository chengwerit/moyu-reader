name: 问题反馈
about: 报告一个 bug，或提一个功能想法
title: ''
labels: ''
assignees: ''

body:

  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈！这个项目只有一个人维护，你的每一条信息都很重要。

  - type: dropdown
    id: type
    attributes:
      label: 类型
      description: 选一个最接近的就行；实在拿不准就选「其他」并在下面说明。
      options:
        - Bug：功能不正常，或与描述不符
        - 功能想法：希望增加某项能力
        - 格式支持：某种电子书解析不了
        - 文档问题：说明写错了、看不懂
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 说清楚你做了什么、期望什么、实际发生什么。截图最好。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如果能复现就写成步骤；不能复现也没关系，如实说明即可。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 如 Windows 11 家庭中文版 23H2
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      description: 浏览器地址栏右侧「⋯」→ 关于里能看到。
      placeholder: 如 Microsoft Edge 130.0.2849.68
    validations:
      required: true

  - type: dropdown
    id: launch-mode
    attributes:
      label: 启动方式
      options:
        - 双击 启动墨语.bat
        - 直接双击 index.html
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 黑窗口报错原文
      description: 有报错就把原文贴进来，不要截图（方便复制搜索）。没有就留空。
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 任何你觉得相关的信息，比如期望的效果、已经试过什么。
    validations:
      required: false
